<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>セミナー用プロンプト</title>

  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
      font-family: sans-serif;
    }

    main {
      max-width: 720px;
      margin: auto;
      padding: 24px 16px 60px;
    }

    h1 {
      font-size: 24px;
    }

    .steps {
      line-height: 1.8;
      font-size: 17px;
    }

    button {
      width: 100%;
      margin: 16px 0;
      padding: 18px;
      border: 0;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      min-height: 30px;
      text-align: center;
      color: #087a37;
      font-size: 18px;
      font-weight: bold;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 300px;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      font-size: 15px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 24px;
      padding: 12px;
      background: #fff4d6;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>セミナー用プロンプト</h1>

    <div class="steps">
      <p>① 下のボタンを押します。</p>
      <p>② 普段お使いの生成AIを開きます。</p>
      <p>③ 入力欄を長押しして「貼り付け」を選びます。</p>
    </div>

    <button id="copyButton" disabled>
      読み込み中です
    </button>

    <div id="message" aria-live="polite"></div>

    <details>
      <summary>プロンプトの内容を確認する</summary>
      <textarea id="prompt" readonly></textarea>
    </details>

    <div class="notice">
      個人情報や社外秘情報は入力しないでください。
    </div>
  </main>

  <script>
    const promptArea = document.getElementById("prompt");
    const copyButton = document.getElementById("copyButton");
    const message = document.getElementById("message");

    fetch("./prompt.txt", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error();
        return response.text();
      })
      .then(text => {
        promptArea.value = text;
        copyButton.disabled = false;
        copyButton.textContent = "プロンプトをコピーする";
      })
      .catch(() => {
        copyButton.textContent = "読み込みに失敗しました";
      });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(promptArea.value);
      } catch {
        promptArea.select();
        promptArea.setSelectionRange(0, promptArea.value.length);
        document.execCommand("copy");
      }

      message.textContent = "コピーしました";
      copyButton.textContent = "コピー完了";
    });
  </script>
</body>
</html>
